name: RSS Parser

on:
  schedule:
    - cron: '*/5 * * * *'   # кожні 5 хвилин
  workflow_dispatch:         # запуск вручну

permissions:
  contents: write

jobs:
  run-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run parser (single pass)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          RUN_ONCE: "true"
        run: python parser.py

      - name: Save history back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in history.json posted_topics.json; do
            [ -f "$f" ] && git add "$f"
          done
          if ! git diff --staged --quiet; then
            git commit -m "chore: update history [skip ci]"
            git pull --rebase origin main
            git push
          fi
